<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Concept Check: Unit 1 — Basic Economic Concepts</title>
<style>
  :root{
    --bg: #FBF6EE;
    --surface: #FFFFFF;
    --surface-alt: #F4EBDA;
    --border: #E7DCC6;
    --ink: #2B2118;
    --ink-soft: #6B5D4C;
    --accent: #D9A441;
    --correct: #2F7D4F;
    --correct-soft: #E5F2E9;
    --incorrect: #C23B3B;
    --incorrect-soft: #FBEAEA;
    --category: #4A5FB0;
    --category-soft: #E9EBF8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.45;
    padding:28px 20px 60px;
  }
  .app{max-width:720px;margin:0 auto;}

  header{
    margin-bottom:20px;
    padding-bottom:18px;
    border-bottom:2px solid var(--border);
  }
  header h1{
    font-size:26px;
    font-weight:800;
    letter-spacing:-0.01em;
    margin:0 0 4px;
  }
  header p{
    margin:0;
    color:var(--ink-soft);
    font-size:14.5px;
  }

  .meta-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
    flex-wrap:wrap;
    gap:10px;
  }
  .card-count{
    font-size:13px;
    font-weight:700;
    color:var(--ink-soft);
  }
  .score-badge{
    font-size:13px;
    font-weight:700;
    color:var(--accent);
    background:#FBF1DC;
    border:1px solid #EAD4A0;
    padding:4px 10px;
    border-radius:999px;
  }

  .panel{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    padding:24px;
  }

  .category-tag{
    display:inline-block;
    font-size:12px;
    font-weight:700;
    color:var(--category);
    background:var(--category-soft);
    padding:4px 10px;
    border-radius:999px;
    margin-bottom:14px;
  }

  .prompt{
    font-size:19px;
    font-weight:600;
    line-height:1.4;
    color:var(--ink);
    margin-bottom:18px;
  }

  .graphic-wrap{
    background:var(--surface-alt);
    border:1px solid var(--border);
    border-radius:12px;
    padding:16px;
    margin-bottom:18px;
    display:flex;
    justify-content:center;
  }
  .graphic-wrap svg{width:100%;max-width:420px;height:auto;display:block;}

  .options{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:16px;
  }
  .choice-btn{
    text-align:left;
    padding:13px 16px;
    border-radius:10px;
    border:1.5px solid var(--border);
    background:var(--surface);
    font-size:15px;
    font-weight:600;
    color:var(--ink);
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .choice-btn:hover:not(:disabled){
    border-color:var(--accent);
    background:#FFFBF2;
  }
  .choice-btn:disabled{cursor:default;}
  .choice-btn.correct{
    background:var(--correct-soft);
    border-color:var(--correct);
    color:var(--correct);
  }
  .choice-btn.incorrect{
    background:var(--incorrect-soft);
    border-color:var(--incorrect);
    color:var(--incorrect);
  }

  .feedback{
    display:none;
    margin-bottom:16px;
  }
  .feedback.show{display:block;}
  .feedback-verdict{
    font-weight:800;
    font-size:15px;
    margin-bottom:6px;
  }
  .feedback-verdict.correct{color:var(--correct);}
  .feedback-verdict.incorrect{color:var(--incorrect);}
  .feedback-explain{
    font-size:14.5px;
    color:var(--ink-soft);
    background:var(--surface-alt);
    border-left:3px solid var(--accent);
    padding:12px 14px;
    border-radius:0 8px 8px 0;
  }

  .controls{
    display:flex;
    justify-content:flex-end;
  }
  .btn{
    padding:11px 20px;
    border-radius:10px;
    border:none;
    font-size:14.5px;
    font-weight:700;
    cursor:pointer;
  }
  .btn-primary{background:var(--ink);color:var(--surface);}
  .btn-primary:hover{background:#453427;}
  .btn:disabled{opacity:.4;cursor:default;}

  footer.reset-row{
    margin-top:20px;
    display:flex;
    justify-content:flex-end;
  }
  .link-btn{
    background:none;
    border:none;
    color:var(--ink-soft);
    font-size:13px;
    text-decoration:underline;
    cursor:pointer;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Concept Check: Unit 1</h1>
    <p>Basic Economic Concepts — definitions, systems, and reading a PPC</p>
  </header>

  <div class="meta-row">
    <span class="card-count" id="cardCount">Card 1 of 38</span>
    <span class="score-badge" id="scoreBadge">Score: 0 / 0</span>
  </div>

  <div class="panel">
    <span class="category-tag" id="categoryTag">Category</span>
    <div class="prompt" id="promptText">Loading…</div>

    <div class="graphic-wrap" id="graphicWrap" style="display:none;">
      <svg viewBox="0 0 360 300" xmlns="http://www.w3.org/2000/svg">
        <line x1="50" y1="250" x2="330" y2="250" stroke="#2B2118" stroke-width="2"/>
        <line x1="50" y1="20" x2="50" y2="250" stroke="#2B2118" stroke-width="2"/>
        <text x="190" y="278" text-anchor="middle" font-size="13" font-weight="700" fill="#6B5D4C">Good X</text>
        <text x="20" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#6B5D4C" transform="rotate(-90 20 140)">Good Y</text>

        <path d="M 50 40 C 120 45, 220 90, 300 235" fill="none" stroke="#2B2118" stroke-width="3"/>
        <text x="300" y="255" font-size="13" font-weight="700" fill="#6B5D4C">PPC</text>

        <circle cx="150" cy="72" r="6" fill="#2F7D4F"/>
        <text x="162" y="66" font-size="15" font-weight="800" fill="#2F7D4F">A</text>

        <circle cx="150" cy="180" r="6" fill="#4A5FB0"/>
        <text x="160" y="180" font-size="15" font-weight="800" fill="#4A5FB0">B</text>

        <circle cx="255" cy="95" r="6" fill="#C23B3B"/>
        <text x="265" y="90" font-size="15" font-weight="800" fill="#C23B3B">C</text>
      </svg>
    </div>

    <div class="options" id="optionsWrap"></div>

    <div class="feedback" id="feedback">
      <div class="feedback-verdict" id="feedbackVerdict"></div>
      <div class="feedback-explain" id="feedbackExplain"></div>
    </div>

    <div class="controls">
      <button class="btn btn-primary" id="nextBtn" disabled>Next card</button>
    </div>
  </div>

  <footer class="reset-row">
    <button class="link-btn" id="resetBtn">Restart from card 1</button>
  </footer>
</div>

<script>
const CARDS = [
  // SCARCITY & FACTORS OF PRODUCTION
  { category:"Scarcity", prompt:"What economic problem exists because resources are limited but human wants are unlimited?",
    options:["Scarcity","Inflation","Recession","Opportunity cost"], correct:0,
    explain:"Scarcity is the foundational problem of economics: resources are limited, but human wants are unlimited. This is why economics — the study of how individuals and societies make choices under scarcity — exists." },
  { category:"Factors of Production", prompt:"Which factor of production includes farmland, oil, timber, water, and minerals?",
    options:["Labor","Land / Natural Resources","Capital","Entrepreneurship"], correct:1,
    explain:"Land/Natural Resources covers all gifts of nature used in production — farmland, oil, timber, water, and minerals are the classic examples." },
  { category:"Factors of Production", prompt:"Which factor of production is the human time and effort used in production — for example, a teacher or a software engineer?",
    options:["Labor","Capital","Land / Natural Resources","Entrepreneurship"], correct:0,
    explain:"Labor is human time and effort used in production. A teacher, a farmer, and a software engineer are all supplying labor." },
  { category:"Factors of Production", prompt:"Which factor of production includes manufactured goods used to produce other goods and services, like machinery, buildings, and tools?",
    options:["Entrepreneurship","Land / Natural Resources","Capital","Labor"], correct:2,
    explain:"Capital refers to manufactured goods used to produce other goods and services — machinery, buildings, and tools. Human capital (education, training) also falls under this factor." },
  { category:"Factors of Production", prompt:"Which factor of production is the ability to combine the other three to create new goods or businesses — and bear the risk of doing so?",
    options:["Capital","Labor","Land / Natural Resources","Entrepreneurship"], correct:3,
    explain:"Entrepreneurship is the ability to combine land, labor, and capital to create new goods or businesses, while bearing the risk involved." },

  // MARGINAL ANALYSIS VOCAB
  { category:"Marginal Analysis", prompt:"In economics, 'marginal' always refers to what?",
    options:["The total amount","The average amount","The next unit — one more, or one less","Only the very first unit"], correct:2,
    explain:"'Marginal' always means incremental — the next unit, one more or one less — never total or average." },
  { category:"Marginal Analysis", prompt:"What is Marginal Benefit (MB)?",
    options:["The additional benefit gained from one more unit","The total benefit of all units combined","The average benefit per unit","The cost of producing the first unit"], correct:0,
    explain:"Marginal Benefit is the additional benefit gained from consuming or producing one more unit — not the total or average." },
  { category:"Marginal Analysis", prompt:"What is Marginal Cost (MC)?",
    options:["The total cost of production","The additional cost incurred from one more unit","The fixed cost of a business","The average cost per unit"], correct:1,
    explain:"Marginal Cost is the additional cost incurred from consuming or producing one more unit." },
  { category:"Marginal Analysis", prompt:"According to the decision rule, when should you pursue an action?",
    options:["Only when Total Benefit is at its highest possible value","When MB ≥ MC","When MC = 0","When MB = 0"], correct:1,
    explain:"Pursue an action when MB ≥ MC, and stop when MB < MC. This logic drives virtually every economic decision." },

  // OPPORTUNITY COST
  { category:"Opportunity Cost", prompt:"What is the opportunity cost of a choice?",
    options:["The total money spent on a choice","The value of the next-best alternative given up","The average cost across all options","The cost of the least attractive alternative"], correct:1,
    explain:"Opportunity cost is the value of the next-best alternative you give up when you make a choice. Every choice has one — even doing nothing." },
  { category:"Opportunity Cost", prompt:"True or false: opportunity cost only includes monetary costs.",
    options:["True","False"], correct:1,
    explain:"False. Opportunity cost includes time, enjoyment, and all foregone options — not just money." },

  // MICRO VS MACRO
  { category:"Micro vs. Macro", prompt:"Which branch of economics studies individuals, households, and firms, and focuses on single markets and prices?",
    options:["Macroeconomics","Microeconomics"], correct:1,
    explain:"Microeconomics studies individuals, households, and firms — focusing on single markets, like how a firm decides how much to produce." },
  { category:"Micro vs. Macro", prompt:"Which branch of economics studies the economy as a whole — for example, what causes recessions and growth?",
    options:["Microeconomics","Macroeconomics"], correct:1,
    explain:"Macroeconomics studies the economy as a whole, focusing on aggregates across all markets — things like GDP, inflation, and recessions." },

  // POSITIVE VS NORMATIVE
  { category:"Positive vs. Normative", prompt:"\"The minimum wage should be raised.\" What type of economic statement is this?",
    options:["Positive", "Normative"], correct:1,
    explain:"This is normative — it expresses an opinion or value judgment about what should be, not a testable fact. The AP tip: 'should' signals normative." },
  { category:"Positive vs. Normative", prompt:"\"A higher minimum wage reduces employment.\" What type of economic statement is this?",
    options:["Normative","Positive"], correct:1,
    explain:"This is positive — it describes how the economy actually works, and can be tested against real data." },
  { category:"Positive vs. Normative", prompt:"Which type of economic statement can be tested against real data and has a correct answer?",
    options:["Normative","Positive"], correct:1,
    explain:"Positive statements can be tested against real data and have a correct answer. Normative statements depend on values, not just facts." },

  // THREE ECONOMIC QUESTIONS
  { category:"Three Economic Questions", prompt:"Every economy must answer three fundamental questions. Which of these is one of them?",
    options:["What to produce?","What is the current inflation rate?","What is GDP this year?","What is the stock market doing?"], correct:0,
    explain:"The three questions every economy must answer are: What to produce? How to produce it? And who gets it?" },
  { category:"Three Economic Questions", prompt:"\"Should output be distributed by price, by need, or by government allocation?\" This addresses which of the three fundamental economic questions?",
    options:["What to produce?","How to produce it?","Who gets it?"], correct:2,
    explain:"This is the 'who gets it?' question — how output should be distributed among members of society." },

  // FOUR ECONOMIC SYSTEMS
  { category:"Economic Systems", prompt:"Which economic system relies on customs, habits, and religion to determine production — answering 'we do it the way it has always been done'?",
    options:["Market Economy","Traditional Economy","Command Economy","Mixed Economy"], correct:1,
    explain:"A Traditional Economy relies on customs, habits, and religion. Amish communities are a classic example." },
  { category:"Economic Systems", prompt:"Which economic system relies on prices and competition to guide decisions — answering 'whatever consumers will pay for'?",
    options:["Market Economy","Command Economy","Traditional Economy","Mixed Economy"], correct:0,
    explain:"A Market Economy uses prices and competition to guide individual and firm decisions — also called capitalist or 'free enterprise.'" },
  { category:"Economic Systems", prompt:"Which economic system has the central government make all economic decisions?",
    options:["Mixed Economy","Traditional Economy","Command Economy","Market Economy"], correct:2,
    explain:"A Command Economy has the central government make all economic decisions — the Soviet Union and North Korea are classic examples." },
  { category:"Economic Systems", prompt:"Which economic system blends market forces and government direction — as seen in the US and Israel?",
    options:["Command Economy","Mixed Economy","Traditional Economy","Market Economy"], correct:1,
    explain:"A Mixed Economy combines market forces with some government oversight — most modern economies, including the US and Israel, are mixed." },

  // INCENTIVES & PROPERTY RIGHTS
  { category:"Incentives & Property Rights", prompt:"What establishes ownership and grants individuals the right to trade goods and services with each other?",
    options:["Incentives","Property Rights","Marginal analysis","Comparative advantage"], correct:1,
    explain:"Property Rights establish ownership and grant individuals the right to trade goods, services, resources, firms, and IP." },
  { category:"Incentives & Property Rights", prompt:"What is anything that motivates a person to make a choice — a reward for doing something, or a penalty for not doing it?",
    options:["An incentive","A subsidy","A tariff","A property right"], correct:0,
    explain:"An incentive is anything that motivates a choice — a reward for an action, or a penalty for not taking it." },
  { category:"Incentives & Property Rights", prompt:"The \"tragedy of the commons\" — where shared resources tend to be overused and degraded — occurs because of a lack of what?",
    options:["Incentives from advertising","Property rights","Government regulation","Marginal analysis"], correct:1,
    explain:"Without property rights, there's no individual incentive to maintain a shared resource, which leads to overuse and degradation — the tragedy of the commons." },

  // ABSOLUTE VS COMPARATIVE ADVANTAGE (terms)
  { category:"Absolute vs. Comparative Advantage", prompt:"The ability to produce MORE of a good than another producer, using the same resources, is called what?",
    options:["Comparative Advantage","Absolute Advantage"], correct:1,
    explain:"Absolute Advantage is the ability to produce more of a good than another producer with the same resources." },
  { category:"Absolute vs. Comparative Advantage", prompt:"The ability to produce a good at a LOWER opportunity cost than another producer is called what?",
    options:["Absolute Advantage","Comparative Advantage"], correct:1,
    explain:"Comparative Advantage is the ability to produce a good at a lower opportunity cost — and this, not absolute advantage, is what drives mutually beneficial trade." },
  { category:"Absolute vs. Comparative Advantage", prompt:"Even if one country has an absolute advantage in EVERYTHING, can both countries still gain from trade?",
    options:["No — only the country with the absolute advantage gains","Yes — both sides still gain by specializing in their comparative advantage"], correct:1,
    explain:"Gains from trade come from differences in opportunity cost, not absolute advantage. Even a country that's better at producing everything still benefits from specializing where its opportunity cost is lowest." },

  // COST CONCEPTS
  { category:"Cost Concepts", prompt:"A cost that does not change with the quantity produced — paid whether you produce 0 or 1,000 units — is called what?",
    options:["Variable Cost","Sunk Cost","Fixed Cost"], correct:2,
    explain:"A Fixed Cost doesn't change with output — like rent on a restaurant, which is the same whether it serves 10 meals or 200." },
  { category:"Cost Concepts", prompt:"A cost that changes with the level of output — like ingredients for more meals served — is called what?",
    options:["Fixed Cost","Variable Cost","Sunk Cost"], correct:1,
    explain:"A Variable Cost changes with output level. More production means higher variable cost." },
  { category:"Cost Concepts", prompt:"A cost that has already been paid, cannot be recovered, and should NOT influence future decisions is called what?",
    options:["Fixed Cost","Variable Cost","Sunk Cost"], correct:2,
    explain:"A Sunk Cost is already paid and unrecoverable — rational decisions should ignore it and focus only on future marginal benefit vs. marginal cost." },

  // UTILITY
  { category:"Utility", prompt:"What is the total satisfaction a consumer receives from ALL units of a good consumed called?",
    options:["Marginal Utility","Total Utility","Net Benefit"], correct:1,
    explain:"Total Utility (TU) is the total satisfaction from all units consumed. It always starts at 0 and rises with consumption, as long as the good is desirable." },
  { category:"Utility", prompt:"What is the additional satisfaction from consuming ONE MORE unit of a good called?",
    options:["Total Utility","Marginal Utility","Net Benefit"], correct:1,
    explain:"Marginal Utility (MU) is the additional satisfaction from one more unit: MU = ΔTU ÷ ΔQ." },
  { category:"Utility", prompt:"The principle that each additional unit consumed provides LESS additional satisfaction than the one before is called what?",
    options:["The law of scarcity","The principle of diminishing marginal utility","The decision rule","Comparative advantage"], correct:1,
    explain:"The principle of diminishing marginal utility: as consumption increases, each additional unit provides less additional satisfaction than the one before — eventually MU can even turn negative." },
  { category:"Utility", prompt:"If Marginal Utility for a good has just reached exactly zero, what does that tell you about Total Utility?",
    options:["Total Utility is at its peak","Total Utility is at zero","Total Utility is falling","Total Utility is negative"], correct:0,
    explain:"When MU = 0, Total Utility is at its peak — the consumer is fully satiated. If they consume even more, MU turns negative and TU starts to fall." },

  // PPC (graph-based)
  { category:"Reading the PPC", prompt:"On the PPC diagram shown, which labeled point represents an EFFICIENT level of production?", graphic:true,
    options:["Point A — on the curve","Point B — inside the curve","Point C — outside the curve"], correct:0,
    explain:"A point ON the curve (like A) is efficient — the economy is getting the maximum output possible from its current resources." },
  { category:"Reading the PPC", prompt:"On the PPC diagram shown, which labeled point represents an INEFFICIENT use of resources?", graphic:true,
    options:["Point A — on the curve","Point B — inside the curve","Point C — outside the curve"], correct:1,
    explain:"A point INSIDE the curve (like B) is inefficient — the economy could produce more of both goods with its existing resources but isn't." },
  { category:"Reading the PPC", prompt:"On the PPC diagram shown, which labeled point represents a combination that is currently UNATTAINABLE?", graphic:true,
    options:["Point A — on the curve","Point B — inside the curve","Point C — outside the curve"], correct:2,
    explain:"A point OUTSIDE the curve (like C) is unattainable — the economy doesn't have enough resources or technology to produce that combination right now." },
  { category:"Reading the PPC", prompt:"Why is the PPC typically bowed outward (concave), rather than a straight line?",
    options:["Because resources are perfectly interchangeable between the two goods","Because of increasing opportunity costs — resources aren't equally suited to producing both goods","Because prices always rise over time","Because of diminishing marginal utility"], correct:1,
    explain:"The bowed-out shape reflects increasing opportunity costs: as production shifts toward one good, each additional unit requires giving up more and more of the other, because resources aren't equally well-suited to both." },
  { category:"Reading the PPC", prompt:"If a country gains new resources (like population growth) or improved technology, which direction does its entire PPC shift?",
    options:["Inward (down and to the left)","Outward (up and to the right)","It doesn't shift — only the point on it moves","It becomes a straight line"], correct:1,
    explain:"Economic growth — from more resources or better technology — shifts the whole PPC outward (up and to the right), expanding the maximum combinations the economy can produce." }
];

let order = [];
let index = 0;
let answered = false;
let score = { correct:0, total:0 };

function shuffledIndices(n){
  const arr = [...Array(n).keys()];
  for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  return arr;
}

function init(){
  order = shuffledIndices(CARDS.length);
  index = 0;
  score = { correct:0, total:0 };
  loadCard();
}

function loadCard(){
  answered = false;
  const card = CARDS[order[index]];
  document.getElementById('cardCount').textContent = `Card ${index+1} of ${CARDS.length}`;
  document.getElementById('scoreBadge').textContent = `Score: ${score.correct} / ${score.total}`;
  document.getElementById('categoryTag').textContent = card.category;
  document.getElementById('promptText').textContent = card.prompt;
  document.getElementById('graphicWrap').style.display = card.graphic ? 'flex' : 'none';
  document.getElementById('feedback').classList.remove('show');
  document.getElementById('nextBtn').disabled = true;

  const wrap = document.getElementById('optionsWrap');
  wrap.innerHTML = '';
  card.options.forEach((optText, i)=>{
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = optText;
    btn.addEventListener('click', ()=>handleAnswer(card, i, btn));
    wrap.appendChild(btn);
  });
}

function handleAnswer(card, chosenIndex, btnEl){
  if(answered) return;
  answered = true;
  const isCorrect = chosenIndex === card.correct;
  score.total++;
  if(isCorrect) score.correct++;
  document.getElementById('scoreBadge').textContent = `Score: ${score.correct} / ${score.total}`;

  [...document.getElementById('optionsWrap').children].forEach((b,i)=>{
    b.disabled = true;
    if(i === card.correct) b.classList.add('correct');
    else if(b === btnEl) b.classList.add('incorrect');
  });

  const fb = document.getElementById('feedback');
  fb.classList.add('show');
  const verdict = document.getElementById('feedbackVerdict');
  verdict.textContent = isCorrect ? 'Correct.' : `Not quite — the answer is "${card.options[card.correct]}."`;
  verdict.className = 'feedback-verdict ' + (isCorrect?'correct':'incorrect');
  document.getElementById('feedbackExplain').textContent = card.explain;

  document.getElementById('nextBtn').disabled = false;
}

document.getElementById('nextBtn').addEventListener('click', ()=>{
  index = (index+1) % CARDS.length;
  if(index === 0) order = shuffledIndices(CARDS.length);
  loadCard();
});

document.getElementById('resetBtn').addEventListener('click', init);

init();
</script>
</body>
</html>
