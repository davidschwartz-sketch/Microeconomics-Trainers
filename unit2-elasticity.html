<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Working Examples: Elasticity</title>
<style>
  :root{
    --bg: #FBF6EE;
    --surface: #FFFFFF;
    --surface-alt: #F4EBDA;
    --border: #E7DCC6;
    --ink: #2B2118;
    --ink-soft: #6B5D4C;
    --accent: #D9A441;
    --correct: #2F7D4F;
    --correct-soft: #E5F2E9;
    --incorrect: #C23B3B;
    --incorrect-soft: #FBEAEA;
    --demand: #2F6F62;
    --supply: #C1542C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.45;
    padding:28px 20px 60px;
  }
  .app{max-width:760px;margin:0 auto;}

  header{
    margin-bottom:20px;
    padding-bottom:18px;
    border-bottom:2px solid var(--border);
  }
  header h1{
    font-size:26px;
    font-weight:800;
    letter-spacing:-0.01em;
    margin:0 0 4px;
  }
  header p{
    margin:0;
    color:var(--ink-soft);
    font-size:14.5px;
  }

  .meta-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
    flex-wrap:wrap;
    gap:10px;
  }
  .count-group{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }
  .card-count{
    font-size:13px;
    font-weight:700;
    color:var(--ink-soft);
    background:var(--surface-alt);
    border:1px solid var(--border);
    padding:4px 10px;
    border-radius:999px;
  }
  .score-badge{
    font-size:13px;
    font-weight:700;
    color:var(--accent);
    background:#FBF1DC;
    border:1px solid #EAD4A0;
    padding:4px 10px;
    border-radius:999px;
  }

  .panel{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    padding:24px;
  }

  .method-badge{
    display:inline-block;
    font-size:11.5px;
    font-weight:800;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:var(--accent);
    background:#FBF1DC;
    border:1px solid #EAD4A0;
    padding:3px 9px;
    border-radius:6px;
    margin-bottom:12px;
  }
  .scenario{
    font-size:14.5px;
    color:var(--ink-soft);
    margin-bottom:14px;
  }
  .formula-note{
    font-size:13.5px;
    color:var(--ink-soft);
    background:var(--surface-alt);
    border:1px dashed var(--border);
    border-radius:10px;
    padding:10px 13px;
    margin-bottom:18px;
  }
  .formula-note b{color:var(--ink);}

  .table-wrap{overflow-x:auto;margin-bottom:20px;}
  table.data-table{
    width:100%;
    border-collapse:collapse;
    font-size:14.5px;
  }
  table.data-table th, table.data-table td{
    border:1px solid var(--border);
    padding:9px 11px;
    text-align:center;
    white-space:nowrap;
  }
  table.data-table th{
    background:var(--surface-alt);
    font-weight:700;
    color:var(--ink-soft);
    font-size:12.5px;
  }
  table.data-table td.row-label{
    font-weight:700;
    text-align:left;
    color:var(--ink-soft);
  }
  table.data-table td.p-cell{color:var(--supply); font-weight:700;}
  table.data-table td.q-cell{color:var(--demand); font-weight:700;}

  .graph-wrap{
    margin-bottom:20px;
    text-align:center;
  }
  .graph-wrap svg{width:100%;max-width:480px;height:auto;}

  .prompt{
    font-size:18px;
    font-weight:600;
    line-height:1.4;
    color:var(--ink);
    margin-bottom:18px;
  }

  .options{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:16px;
  }
  .choice-btn{
    text-align:left;
    padding:13px 16px;
    border-radius:10px;
    border:1.5px solid var(--border);
    background:var(--surface);
    font-size:15px;
    font-weight:600;
    color:var(--ink);
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .choice-btn:hover:not(:disabled){
    border-color:var(--accent);
    background:#FFFBF2;
  }
  .choice-btn:disabled{cursor:default;}
  .choice-btn.correct{
    background:var(--correct-soft);
    border-color:var(--correct);
    color:var(--correct);
  }
  .choice-btn.incorrect{
    background:var(--incorrect-soft);
    border-color:var(--incorrect);
    color:var(--incorrect);
  }

  .feedback{
    display:none;
    margin-bottom:16px;
  }
  .feedback.show{display:block;}
  .feedback-verdict{
    font-weight:800;
    font-size:15px;
    margin-bottom:6px;
  }
  .feedback-verdict.correct{color:var(--correct);}
  .feedback-verdict.incorrect{color:var(--incorrect);}
  .feedback-explain{
    font-size:14.5px;
    color:var(--ink-soft);
    background:var(--surface-alt);
    border-left:3px solid var(--accent);
    padding:12px 14px;
    border-radius:0 8px 8px 0;
  }

  .controls{
    display:flex;
    justify-content:flex-end;
  }
  .btn{
    padding:11px 20px;
    border-radius:10px;
    border:none;
    font-size:14.5px;
    font-weight:700;
    cursor:pointer;
  }
  .btn-primary{background:var(--ink);color:var(--surface);}
  .btn-primary:hover{background:#453427;}
  .btn:disabled{opacity:.4;cursor:default;}

  footer.reset-row{
    margin-top:20px;
    display:flex;
    justify-content:flex-end;
  }
  .link-btn{
    background:none;
    border:none;
    color:var(--ink-soft);
    font-size:13px;
    text-decoration:underline;
    cursor:pointer;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Working Examples: Elasticity</h1>
    <p>PED, XED, YED and PES &mdash; simple vs. midpoint method, determinants, and the total revenue test</p>
  </header>

  <div class="meta-row">
    <div class="count-group">
      <span class="card-count" id="problemCount">Problem 1 of 10</span>
      <span class="card-count" id="stepCount">Step 1 of 5</span>
    </div>
    <span class="score-badge" id="scoreBadge">Score: 0 / 0</span>
  </div>

  <div class="panel">
    <span class="method-badge" id="methodBadge"></span>
    <div class="scenario" id="scenarioText"></div>
    <div class="formula-note" id="formulaNote"></div>

    <div class="table-wrap" id="tableWrap">
      <table class="data-table">
        <thead><tr id="tableHead"></tr></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>

    <div class="graph-wrap" id="graphWrap"></div>

    <div class="prompt" id="promptText">Loading&hellip;</div>

    <div class="options" id="optionsWrap"></div>

    <div class="feedback" id="feedback">
      <div class="feedback-verdict" id="feedbackVerdict"></div>
      <div class="feedback-explain" id="feedbackExplain"></div>
    </div>

    <div class="controls">
      <button class="btn btn-primary" id="nextBtn" disabled>Next step</button>
    </div>
  </div>

  <footer class="reset-row">
    <button class="link-btn" id="resetBtn">Restart from problem 1</button>
  </footer>
</div>

<script>
/* ---------------------------------------------------------------------------
   Every number in this bank was computed and asserted in a scratch script
   before being written here (midpoint and simple-method percentage changes,
   elasticities, total revenues, and the TR-maximizing point of the linear
   demand curve). Conventions follow the Unit 2 deck: the "simple method"
   uses the STARTING value as the base; |PED| is reported as an absolute
   value; PES comes out positive on its own; XED and YED keep their signs.
--------------------------------------------------------------------------- */

const DEMAND_GRAPH = `
<svg viewBox="0 0 360 250" role="img" aria-label="Straight-line demand curve P = 16 minus Q, elastic above the midpoint at P=8 Q=8 and inelastic below it">
  <line x1="48" y1="210" x2="340" y2="210" stroke="#6B5D4C" stroke-width="1.5"/>
  <line x1="48" y1="210" x2="48" y2="24" stroke="#6B5D4C" stroke-width="1.5"/>
  <text x="340" y="232" text-anchor="end" font-size="10.5" fill="#6B5D4C">Q (hundreds of passes)</text>
  <text x="44" y="20" text-anchor="end" font-size="10.5" fill="#6B5D4C">P ($)</text>
  <line x1="48" y1="30" x2="328" y2="210" stroke="#2F6F62" stroke-width="2.5"/>
  <text x="333" y="200" font-size="11" font-weight="700" fill="#2F6F62">D</text>
  <line x1="48" y1="120" x2="188" y2="120" stroke="#D9A441" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="188" y1="120" x2="188" y2="210" stroke="#D9A441" stroke-width="1" stroke-dasharray="3 3"/>
  <circle cx="118" cy="75"  r="3.5" fill="#2F6F62"/>
  <circle cx="153" cy="98"  r="3.5" fill="#2F6F62"/>
  <circle cx="171" cy="109" r="3"   fill="#2F6F62"/>
  <circle cx="206" cy="131" r="3"   fill="#2F6F62"/>
  <circle cx="223" cy="143" r="3.5" fill="#2F6F62"/>
  <circle cx="258" cy="165" r="3.5" fill="#2F6F62"/>
  <circle cx="188" cy="120" r="5.5" fill="#FFFFFF" stroke="#D9A441" stroke-width="2.5"/>
  <text x="126" y="60"  font-size="10.5" font-weight="700" fill="#2F6F62">elastic  |PED| &gt; 1</text>
  <text x="198" y="116" font-size="10.5" font-weight="700" fill="#D9A441">|PED| = 1 &middot; TR max</text>
  <text x="200" y="192" font-size="10.5" font-weight="700" fill="#2F6F62">inelastic  |PED| &lt; 1</text>
  <text x="44" y="124" text-anchor="end" font-size="10" fill="#6B5D4C">8</text>
  <text x="44" y="34"  text-anchor="end" font-size="10" fill="#6B5D4C">16</text>
  <text x="188" y="224" text-anchor="middle" font-size="10" fill="#6B5D4C">8</text>
  <text x="328" y="224" text-anchor="middle" font-size="10" fill="#6B5D4C">16</text>
</svg>`;

const SUPPLY_GRAPH = `
<svg viewBox="0 0 360 250" role="img" aria-label="Straight-line supply curve through the origin, unit elastic at every point">
  <line x1="48" y1="210" x2="340" y2="210" stroke="#6B5D4C" stroke-width="1.5"/>
  <line x1="48" y1="210" x2="48" y2="24" stroke="#6B5D4C" stroke-width="1.5"/>
  <text x="340" y="232" text-anchor="end" font-size="10.5" fill="#6B5D4C">Q (posters)</text>
  <text x="44" y="20" text-anchor="end" font-size="10.5" fill="#6B5D4C">P ($)</text>
  <line x1="48" y1="210" x2="286" y2="56" stroke="#C1542C" stroke-width="2.5"/>
  <text x="292" y="52" font-size="11" font-weight="700" fill="#C1542C">S</text>
  <circle cx="48"  cy="210" r="3.5" fill="#C1542C"/>
  <circle cx="116" cy="166" r="3.5" fill="#C1542C"/>
  <circle cx="184" cy="122" r="3.5" fill="#C1542C"/>
  <circle cx="252" cy="78"  r="3.5" fill="#C1542C"/>
  <text x="126" y="182" font-size="10" fill="#6B5D4C">$0.50, 1</text>
  <text x="194" y="138" font-size="10" fill="#6B5D4C">$1.00, 2</text>
  <text x="262" y="94"  font-size="10" fill="#6B5D4C">$1.50, 3</text>
  <text x="120" y="80"  text-anchor="middle" font-size="10.5" font-weight="700" fill="#C1542C">PES = 1.00 everywhere</text>
  <text x="52"  y="226" font-size="10" fill="#6B5D4C">origin</text>
  <text x="116" y="226" text-anchor="middle" font-size="10" fill="#6B5D4C">1</text>
  <text x="184" y="226" text-anchor="middle" font-size="10" fill="#6B5D4C">2</text>
  <text x="252" y="226" text-anchor="middle" font-size="10" fill="#6B5D4C">3</text>
</svg>`;

const PROBLEMS = [
  /* ----------------------------------------------------------------- P1 */
  {
    id: "P1",
    method: "Simple method, then midpoint method",
    scenario: "Cedar Lane Bakery is looking at two points on the demand curve for its sourdough loaves. At $8 a loaf it sells 60 loaves a week; at $10 a loaf it sells 45.",
    formula: "<b>Simple method:</b> %&Delta;X = (X&#8322; &minus; X&#8321;) &divide; X&#8321; &nbsp;&bull;&nbsp; <b>Midpoint method:</b> %&Delta;X = (X&#8322; &minus; X&#8321;) &divide; [(X&#8321; + X&#8322;) &divide; 2]",
    table: {
      cols: ["", "Price per loaf", "Loaves per week"],
      colClass: ["row-label", "p-cell", "q-cell"],
      rows: [["Point A", "$8", "60"], ["Point B", "$10", "45"]]
    },
    steps: [
      { prompt: "Use the simple method to find |PED| for a price RISE from $8 to $10, so the $8 / 60 end supplies the base.",
        options: ["1.00", "1.67", "0.75", "1.25"], correct: 0,
        explain: "%ΔQ = (45 − 60) ÷ 60 = −25%. %ΔP = ($10 − $8) ÷ $8 = +25%. |PED| = 25% ÷ 25% = 1.00 — this looks like a textbook unit-elastic result. Hold on to it." },
      { prompt: "Now run the very same pair of points in the other direction — a price FALL from $10 to $8, so the $10 / 45 end supplies the base. What is |PED| by the simple method?",
        options: ["1.67", "1.00", "0.60", "2.00"], correct: 0,
        explain: "%ΔQ = (60 − 45) ÷ 45 = +33.33%. %ΔP = ($8 − $10) ÷ $10 = −20%. |PED| = 33.33% ÷ 20% = 1.67. Same bakery, same two points, a different elasticity." },
      { prompt: "Why did the same pair of points give 1.00 one way and 1.67 the other?",
        options: ["Because the simple method divides by the starting value, and the two directions start from different bases",
                  "Because demand is genuinely elastic going up and inelastic going down",
                  "Because one calculation used price as the base and the other used quantity",
                  "Because rounding to two decimals compounds across the two percentages"], correct: 0,
        explain: "Nothing about the market changed — only the denominator did. Running the change upward divides by $8 and 60; running it downward divides by $10 and 45. That direction-dependence is exactly the flaw the midpoint method exists to fix." },
      { prompt: "Switch to the midpoint method. What is the percentage change in quantity demanded between these two points?",
        options: ["−28.57%", "−25%", "−33.33%", "−15%"], correct: 0,
        explain: "Q_avg = (60 + 45) ÷ 2 = 52.5. ΔQ = 45 − 60 = −15. %ΔQ = −15 ÷ 52.5 = −28.57%. Notice it lands between the two simple-method answers, −25% and −33.33%." },
      { prompt: "By the midpoint method the quantity change is \u221228.57%. Finish the calculation: what is |PED|?",
        options: ["1.29", "1.00", "1.67", "0.78"], correct: 0,
        explain: "P_avg = ($8 + $10) ÷ 2 = $9, so %ΔP = $2 ÷ $9 = +22.22%. |PED| = 28.57% ÷ 22.22% = 1.29. Run it downward instead and you get 1.29 again — the midpoint method gives one answer per pair of points, whichever way you read the change." },
      { prompt: "The midpoint method gives |PED| = 1.29. How should demand for Cedar Lane's sourdough be classified?",
        options: ["Elastic, because |PED| > 1", "Unit elastic, because |PED| = 1",
                  "Inelastic, because |PED| < 1", "Perfectly inelastic, because |PED| = 0"], correct: 0,
        explain: "|PED| = 1.29 > 1, so demand is elastic. This is the payoff of the whole problem: the simple method run upward gave exactly 1.00 and would have had you call this unit elastic — a different classification, not just a different decimal." }
    ]
  },

  /* ----------------------------------------------------------------- P2 */
  {
    id: "P2",
    method: "Midpoint method",
    scenario: "Riverbend Pharmacy raises the price of a prescription asthma inhaler from $30 to $50. Inhalers dispensed per month fall from 800 to 700.",
    formula: "<b>|PED|</b> = %&Delta; quantity demanded &divide; %&Delta; price, both on midpoint bases. <b>TR</b> = Price &times; Quantity.",
    table: {
      cols: ["", "Price per inhaler", "Inhalers per month"],
      colClass: ["row-label", "p-cell", "q-cell"],
      rows: [["Before", "$30", "800"], ["After", "$50", "700"]]
    },
    steps: [
      { prompt: "Using the midpoint method, what is the percentage change in quantity demanded?",
        options: ["−13.33%", "−12.5%", "−14.29%", "−25%"], correct: 0,
        explain: "Q_avg = (800 + 700) ÷ 2 = 750. ΔQ = −100. %ΔQ = −100 ÷ 750 = −13.33%. Dividing by the starting 800 gives −12.5%, but that is the simple method, not what this problem asked for." },
      { prompt: "Using the midpoint method, what is the percentage change in price?",
        options: ["+50%", "+66.67%", "+40%", "+25%"], correct: 0,
        explain: "P_avg = ($30 + $50) ÷ 2 = $40. ΔP = +$20. %ΔP = $20 ÷ $40 = +50%." },
      { prompt: "The midpoint percentage changes are \u221213.33% in quantity demanded and +50% in price. What is |PED|?",
        options: ["0.27", "3.75", "0.19", "1.33"], correct: 0,
        explain: "|PED| = 13.33% ÷ 50% = 0.2667, which rounds to 0.27. Inverting the fraction (50 ÷ 13.33 = 3.75) is the most common slip here — quantity always goes on top." },
      { prompt: "Demand for the inhaler works out to |PED| = 0.27. Classify it, and name the determinant that best explains it.",
        options: ["Inelastic — an inhaler is a necessity with no close substitute for the patient who needs it",
                  "Elastic — a $20 increase is a large share of a household's monthly budget",
                  "Unit elastic — quantity and price moved by the same percentage",
                  "Inelastic — patients had a long time horizon over which to adjust"], correct: 0,
        explain: "|PED| = 0.27 < 1, so demand is inelastic. Two of the five determinants drive it: there is no substitute for the medication, and it is a necessity rather than a discretionary purchase. A long time horizon would push the other way, toward MORE elastic demand." },
      { prompt: "Demand is inelastic, |PED| = 0.27. Run the total revenue test: what happens to Riverbend's revenue on this product?",
        options: ["It rises, from $24,000 to $35,000", "It falls, from $24,000 to $21,000",
                  "It is unchanged at $24,000", "It rises, from $24,000 to $40,000"], correct: 0,
        explain: "TR = P × Q. Before: $30 × 800 = $24,000. After: $50 × 700 = $35,000. That is the general rule for inelastic demand — quantity falls by a smaller percentage than price rises, so the price effect dominates and revenue rises. ($40,000 is what you get by forgetting that quantity fell at all.)" }
    ]
  },

  /* ----------------------------------------------------------------- P3 */
  {
    id: "P3",
    method: "Midpoint method",
    scenario: "Kwan's Cafe cuts the price of its large iced coffee from $5 to $3 for a summer promotion. Sales climb from 400 cups a week to 1,200.",
    formula: "<b>|PED|</b> = %&Delta; quantity demanded &divide; %&Delta; price, both on midpoint bases. <b>TR</b> = Price &times; Quantity.",
    table: {
      cols: ["", "Price per cup", "Cups per week"],
      colClass: ["row-label", "p-cell", "q-cell"],
      rows: [["Before", "$5", "400"], ["After", "$3", "1,200"]]
    },
    steps: [
      { prompt: "Using the midpoint method, what is the percentage change in quantity demanded?",
        options: ["+100%", "+200%", "+66.67%", "+50%"], correct: 0,
        explain: "Q_avg = (400 + 1,200) ÷ 2 = 800. ΔQ = +800. %ΔQ = 800 ÷ 800 = +100%. The simple method would have given 800 ÷ 400 = +200%." },
      { prompt: "Using the midpoint method, what is the percentage change in price?",
        options: ["−50%", "−40%", "−66.67%", "−33.33%"], correct: 0,
        explain: "P_avg = ($5 + $3) ÷ 2 = $4. ΔP = −$2. %ΔP = −$2 ÷ $4 = −50%." },
      { prompt: "The midpoint percentage changes are +100% in quantity demanded and \u221250% in price. What is |PED|?",
        options: ["2.00", "0.50", "1.00", "3.00"], correct: 0,
        explain: "|PED| = 100% ÷ 50% = 2.00. In percentage terms, quantity demanded is twice as responsive as price. The negative signs cancel in the ratio, which is why we report the absolute value." },
      { prompt: "Demand for the large iced coffee works out to |PED| = 2.00. Classify it, and name the determinants behind it.",
        options: ["Elastic — a $5 iced coffee is discretionary and has many close substitutes",
                  "Inelastic — regular customers will buy their coffee at any price",
                  "Unit elastic — the price cut and the sales jump offset each other",
                  "Perfectly elastic — quantity demanded responded at all"], correct: 0,
        explain: "|PED| = 2.00 > 1, so demand is elastic. Two determinants point the same way: iced coffee is a luxury rather than a necessity, and substitutes are everywhere — a different cafe, a bottled drink, coffee brewed at home." },
      { prompt: "Demand is elastic, |PED| = 2.00, and the cafe CUT its price. Run the total revenue test: what happens to revenue on large iced coffees?",
        options: ["It rises, from $2,000 to $3,600", "It falls, from $2,000 to $1,200",
                  "It is unchanged at $2,000", "It falls, from $3,600 to $2,000"], correct: 0,
        explain: "TR = P × Q. Before: $5 × 400 = $2,000. After: $3 × 1,200 = $3,600. With elastic demand, cutting the price raises revenue, because the quantity effect dominates the price effect. Compare the inhaler problem: same test, opposite prescription, because the classification is opposite." }
    ]
  },

  /* ----------------------------------------------------------------- P4 */
  {
    id: "P4",
    method: "Midpoint method · straight-line demand curve",
    scenario: "Harborview Ferry sells day passes. Its demand curve is the straight line P = 16 − Q, where Q is measured in hundreds of passes per day. The slope of that line is identical at every point on it.",
    formula: "<b>|PED|</b> = %&Delta; quantity demanded &divide; %&Delta; price, both on midpoint bases. <b>TR</b> = Price &times; Quantity.",
    table: {
      cols: ["Price per pass", "Quantity (hundreds)"],
      colClass: ["p-cell", "q-cell"],
      rows: [["$12", "4"], ["$10", "6"], ["$9", "7"], ["$8", "8"], ["$7", "9"], ["$6", "10"], ["$4", "12"]]
    },
    graph: "DEMAND",
    steps: [
      { prompt: "Start high on the curve: price falls from $12 to $10 and quantity rises from 4 to 6. Using the midpoint method, what is |PED| over that range?",
        options: ["2.20", "0.45", "1.00", "1.20"], correct: 0,
        explain: "Q_avg = (4 + 6) ÷ 2 = 5, so %ΔQ = 2 ÷ 5 = +40%. P_avg = ($12 + $10) ÷ 2 = $11, so %ΔP = −$2 ÷ $11 = −18.18%. |PED| = 40% ÷ 18.18% = 2.20 — elastic." },
      { prompt: "Now go low on the same curve: price falls from $6 to $4 and quantity rises from 10 to 12 — the identical $2 price change and the identical 2-unit quantity change. Using the midpoint method, what is |PED| here?",

/* ------------------------------------------------------------ state + helpers */
let problemOrder = [];
let problemIndex = 0;
let stepIndex = 0;
let answered = false;
let optionOrder = [];               // display position -> index in step.options
let score = { correct: 0, total: 0 };

/* Fisher-Yates */
function shuffledIndices(n){
  const arr = [...Array(n).keys()];
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function currentProblem(){ return PROBLEMS[problemOrder[problemIndex]]; }

function init(){
  problemOrder = shuffledIndices(PROBLEMS.length);
  problemIndex = 0;
  score = { correct: 0, total: 0 };
  loadProblem();
}

function loadProblem(){
  stepIndex = 0;
  const problem = currentProblem();

  document.getElementById('methodBadge').textContent = problem.method;
  document.getElementById('scenarioText').textContent = problem.scenario;
  document.getElementById('formulaNote').innerHTML = problem.formula;
  document.getElementById('problemCount').textContent =
    `Problem ${problemIndex + 1} of ${PROBLEMS.length}`;

  const wrap = document.getElementById('tableWrap');
  if(problem.table){
    wrap.style.display = 'block';
    document.getElementById('tableHead').innerHTML =
      problem.table.cols.map(c => `<th>${c}</th>`).join('');
    document.getElementById('tableBody').innerHTML = problem.table.rows
      .map(r => '<tr>' + r.map((cell, i) =>
        `<td class="${problem.table.colClass[i]}">${cell}</td>`).join('') + '</tr>')
      .join('');
  } else {
    wrap.style.display = 'none';
  }

  const graphWrap = document.getElementById('graphWrap');
  if(problem.graph === 'DEMAND'){
    graphWrap.style.display = 'block';
    graphWrap.innerHTML = DEMAND_GRAPH;
  } else if(problem.graph === 'SUPPLY'){
    graphWrap.style.display = 'block';
    graphWrap.innerHTML = SUPPLY_GRAPH;
  } else {
    graphWrap.style.display = 'none';
    graphWrap.innerHTML = '';
  }

  loadStep();
}

function loadStep(){
  answered = false;
  const problem = currentProblem();
  const step = problem.steps[stepIndex];

  document.getElementById('stepCount').textContent =
    `Step ${stepIndex + 1} of ${problem.steps.length}`;
  document.getElementById('scoreBadge').textContent =
    `Score: ${score.correct} / ${score.total}`;
  document.getElementById('promptText').textContent = step.prompt;
  document.getElementById('feedback').classList.remove('show');

  const nextBtn = document.getElementById('nextBtn');
  nextBtn.disabled = true;
  nextBtn.textContent = (stepIndex === problem.steps.length - 1) ? 'Next problem' : 'Next step';

  // Shuffle the answer choices too, so the correct option is never in a fixed slot.
  optionOrder = shuffledIndices(step.options.length);
  const wrap = document.getElementById('optionsWrap');
  wrap.innerHTML = '';
  optionOrder.forEach(origIndex => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = step.options[origIndex];
    btn.addEventListener('click', () => handleAnswer(step, origIndex, btn));
    wrap.appendChild(btn);
  });
}

function handleAnswer(step, chosenIndex, btnEl){
  if(answered) return;
  answered = true;

  const isCorrect = chosenIndex === step.correct;
  score.total++;
  if(isCorrect) score.correct++;
  document.getElementById('scoreBadge').textContent =
    `Score: ${score.correct} / ${score.total}`;

  [...document.getElementById('optionsWrap').children].forEach((b, pos) => {
    b.disabled = true;
    if(optionOrder[pos] === step.correct) b.classList.add('correct');
    else if(b === btnEl) b.classList.add('incorrect');
  });

  const fb = document.getElementById('feedback');
  fb.classList.add('show');
  const verdict = document.getElementById('feedbackVerdict');
  verdict.textContent = isCorrect
    ? 'Correct.'
    : `Not quite — the answer is "${step.options[step.correct]}."`;
  verdict.className = 'feedback-verdict ' + (isCorrect ? 'correct' : 'incorrect');
  document.getElementById('feedbackExplain').textContent = step.explain;

  document.getElementById('nextBtn').disabled = false;
}

document.getElementById('nextBtn').addEventListener('click', () => {
  const problem = currentProblem();
  if(stepIndex < problem.steps.length - 1){
    stepIndex++;
    loadStep();
  } else {
    problemIndex = (problemIndex + 1) % PROBLEMS.length;
    if(problemIndex === 0) problemOrder = shuffledIndices(PROBLEMS.length);
    loadProblem();
  }
});

document.getElementById('resetBtn').addEventListener('click', init);

init();
</script>
</body>
</html>
